<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Student Requirements and Document Tracking System</title>
  <defs>
    <!-- Knocks a clean gap around the check so the logo works on any background -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M24 39L32 47L57 15" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <g mask="url(#cut)">
    <!-- Hexagon frame -->
    <path d="M34 6L56.5 19V45L34 58L11.5 45V19Z" fill="none" stroke="#14407A" stroke-width="5" stroke-linejoin="round"/>

    <!-- Graduation tassel -->
    <path d="M3 19H11" stroke="#14407A" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M5.5 19V30" stroke="#14407A" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="5.5" cy="32.5" r="2.4" fill="#14407A"/>

    <g transform="translate(0 -2.5)">
    <!-- Open book: pages -->
    <path d="M18.5 22Q24.5 20.5 30 24V31Q24.5 28 18.5 29.5Z" fill="#8FD8FA" stroke="#8FD8FA" stroke-width="1" stroke-linejoin="round"/>
    <path d="M41.5 22Q35.5 20.5 30 24V31Q35.5 28 41.5 29.5Z" fill="#8FD8FA" stroke="#8FD8FA" stroke-width="1" stroke-linejoin="round"/>
    <!-- Open book: cover -->
    <path d="M18 32Q24 30.5 30 34Q36 30.5 42 32V37Q36 35.5 30 39Q24 35.5 18 37Z" fill="#14407A" stroke="#14407A" stroke-width="1" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Check mark -->
  <path d="M24 39L32 47L57 15" fill="none" stroke="#1FB5F0" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
